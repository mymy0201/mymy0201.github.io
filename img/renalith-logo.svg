<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="300" y="70" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="52" font-weight="700" fill="url(#grad)" letter-spacing="4" filter="url(#glow)">RENALITH SAGA</text>
  <text x="300" y="115" text-anchor="middle" font-family="'Yu Gothic', 'Hiragino Mincho ProN', serif" font-size="20" font-weight="500" fill="#d8b4fe" letter-spacing="10">レナリスサーガ</text>
  <line x1="160" y1="135" x2="440" y2="135" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.6"/>
  <polygon points="300,131 304,135 300,139 296,135" fill="#f0db26"/>
</svg>